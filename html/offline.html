<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Energy-Logger – offline</title>
    <!-- Self-contained: shown by the service worker when the logger is unreachable -->
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #222;
        color: #eee;
        margin: 0;
        padding: 16px;
        padding-top: calc(16px + env(safe-area-inset-top));
        line-height: 1.6;
        text-align: center;
      }
      .card {
        max-width: 500px;
        margin: 40px auto;
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 20px;
      }
      h1 { color: #fff; }
      #state { color: #ffbf00; font-weight: bold; }
      button {
        padding: 12px 25px;
        background: #00d1ff;
        color: #111;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Energy-Logger</h1>
      <p id="state">Logger nicht erreichbar</p>
      <p>Ist das Telefon mit dem WLAN des Loggers verbunden?</p>
      <button id="wifiBtn">WLAN wechseln</button>
    </div>
    <script>
      const state = document.getElementById("state");

      document.getElementById("wifiBtn").addEventListener("click", () => {
        if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          window.location.href = "shortcuts://run-shortcut?name=ChangeWIFI";
        } else {
          alert("WLAN-Wechsel nur auf iPhone/iPad verfügbar.");
        }
      });

      // Check every 5 s whether the logger is back, then load the app
      async function check() {
        if (document.hidden) return;
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 4000);
        try {
          const r = await fetch("ping", { signal: ctrl.signal, cache: "no-store" });
          if (r.ok) {
            state.textContent = "Logger wieder erreichbar — lade…";
            state.style.color = "#4caf50";
            window.location.href = "./?v=" + Date.now();
          }
        } catch (e) {
          // still offline
        } finally {
          clearTimeout(timer);
        }
      }
      setInterval(check, 5000);
    </script>
  </body>
</html>
